services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-passwordmanager}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-passwordmanager}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  back:
    build:
      context: ./src/PasswordManager.Api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # This same file is also used by the production Portainer stack (see README) - must NOT
      # default to Development there (it would leak the dev-only email-verification-code log to
      # production). Set ASPNETCORE_ENVIRONMENT=Development in your local .env for that convenience.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-passwordmanager};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      Jwt__Issuer: PasswordManager
      Jwt__Audience: PasswordManager.Clients
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL:-}
      Smtp__FromName: ${SMTP_FROM_NAME:-Password Manager}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    networks:
      - internal

volumes:
  db-data:

networks:
  internal:
